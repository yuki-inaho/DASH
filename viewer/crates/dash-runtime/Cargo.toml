[package]
name = "dash-runtime"
version = "0.1.0"
edition = "2021"
description = "Reusable, viewer-agnostic native bridge to a DASH (PyTorch/CUDA) sidecar: process lifecycle + length-prefixed TCP protocol returning packed Gaussian frames."
license = "MIT"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
